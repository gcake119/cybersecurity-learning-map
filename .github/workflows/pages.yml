name: Deploy learning map to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ["self-hosted", "Linux", "X64", "repo-cybersecurity-learning-map"]
    timeout-minutes: 310
    defaults:
      run:
        shell: bash scripts/ci/run-step.sh {0}
    outputs:
      source_sha: ${{ steps.evidence.outputs.sha }}
      artifact_id: ${{ steps.pages.outputs.artifact_id }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Require trusted source before self-hosted execution
        id: ci_source_admission
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          CI_SOURCE_TRUSTED: ${{ github.repository == 'gcake119/cybersecurity-learning-map' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          [[ "${CI_SOURCE_TRUSTED:-}" == true ]] || {
            echo 'CI_SOURCE_REQUIRES_ISOLATED_SELF_HOSTED_RUNNER' >&2
            exit 1
          }
      - uses: actions/checkout@v4
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Mint identity, shared controls and browser cache
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        env:
          CI_RESOURCE_CLASS: light
        run: bash scripts/ci/prepare-mint.sh
      - uses: pnpm/action-setup@v4
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        with:
          dest: ${{ runner.temp }}/cyber-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
      - run: pnpm build
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
      - run: pnpm test
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
      - run: bash scripts/ci/install-browser.sh
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
      - run: time timeout --signal=TERM --kill-after=30s 1200s pnpm test:browser
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
      - name: Record complete browser and exact build evidence
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        id: evidence
        env:
          CI_RESOURCE_CLASS: light
        run: python3 scripts/ci/record-verification.py
      - name: Preserve untrusted PR diagnostic exception
        if: ${{ steps.ci_source_admission.outcome == 'success' && ((success()) && !(github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository))) }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-verification.json
          if-no-files-found: error
      - name: Store trusted ci-verification
        if: ${{ steps.ci_source_admission.outcome == 'success' && ((success()) && (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository))) }}
        uses: ./.github/actions/ci-artifact
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          profile: ci-verification
          path: ci-verification.json
          receipt: ci-verification.json
          outcome: ${{ job.status == 'success' && 'pass' || job.status == 'failure' && 'fail' || 'unknown' }}
          evidence-class: diagnostic
          if-no-files-found: error
      - name: Preserve untrusted PR diagnostic exception
        if: ${{ steps.ci_source_admission.outcome == 'success' && ((always()) && !(github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository))) }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ github.run_attempt }}
          path: output/playwright/
          retention-days: 7
      - name: Store trusted browser-screenshots
        if: ${{ steps.ci_source_admission.outcome == 'success' && ((always()) && (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository))) }}
        uses: ./.github/actions/ci-artifact
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          profile: browser-screenshots
          path: output/playwright/
          outcome: ${{ job.status == 'success' && 'pass' || job.status == 'failure' && 'fail' || 'unknown' }}
          evidence-class: diagnostic
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.ci_source_admission.outcome == 'success' }}
        id: pages
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
  deploy:
    if: ${{ vars.ENABLE_PAGES_PUBLICATION == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require exact verified build identity
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Record actual Pages publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg pageUrl "$PAGE_URL" \
            --arg artifactId "$ARTIFACT_ID" --arg artifactName "$ARTIFACT_NAME" --arg runId "$GITHUB_RUN_ID" \
            '{sourceSha:$sha,pageUrl:$pageUrl,artifactId:$artifactId,artifactName:$artifactName,workflowRun:$runId,pagesPublication:"passed",humanLearningReview:"not-run"}' \
            > pages-publication.json
      - name: Preserve untrusted PR diagnostic exception
        if: ${{ (success()) && !(github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: pages-publication.json
          if-no-files-found: error
      - name: Check out exact transport control without replacing publication receipt
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-artifact-control
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Join approved private artifact transport
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.ci-artifact-control/.github/actions/ci-artifact-connect
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          client-id: ${{ vars.CI_ARTIFACT_TS_CLIENT_ID }}
          audience: ${{ vars.CI_ARTIFACT_TS_AUDIENCE }}
      - name: Store trusted pages-publication
        if: ${{ (success()) && (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: ./.ci-artifact-control/.github/actions/ci-artifact
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          profile: pages-publication
          path: pages-publication.json
          receipt: pages-publication.json
          outcome: ${{ job.status == 'success' && 'pass' || job.status == 'failure' && 'fail' || 'unknown' }}
          evidence-class: diagnostic
          if-no-files-found: error
