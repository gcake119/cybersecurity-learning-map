name: V2 technical QA
on:
  push:
    branches: [learning-map-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository == 'gcake119/cybersecurity-learning-map' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","repo-cybersecurity-learning-map"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash scripts/ci/run-step.sh {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Mint identity, shared controls and browser cache
        env:
          CI_RESOURCE_CLASS: light
        run: bash scripts/ci/prepare-mint.sh
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/cyber-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/ci/install-browser.sh
      - run: time timeout --signal=TERM --kill-after=30s 1200s pnpm test:browser
      - name: Record complete browser and exact build evidence
        id: evidence
        env:
          CI_RESOURCE_CLASS: light
        run: python3 scripts/ci/record-verification.py
      - name: Preserve untrusted PR diagnostic exception
        if: ${{ (success()) && !(github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-verification.json
          if-no-files-found: error
      - name: Store trusted ci-verification
        if: ${{ (success()) && (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: ./.github/actions/ci-artifact
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          profile: ci-verification
          path: ci-verification.json
          receipt: ci-verification.json
          outcome: ${{ job.status == 'success' && 'pass' || job.status == 'failure' && 'fail' || 'unknown' }}
          evidence-class: diagnostic
          if-no-files-found: error
      - name: Preserve untrusted PR diagnostic exception
        if: ${{ (always()) && !(github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-browser-qa
          path: output/playwright/
      - name: Store trusted v2-browser-qa
        if: ${{ (always()) && (github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: ./.github/actions/ci-artifact
        with:
          endpoint: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
          profile: v2-browser-qa
          path: output/playwright/
          outcome: ${{ job.status == 'success' && 'pass' || job.status == 'failure' && 'fail' || 'unknown' }}
          evidence-class: diagnostic
          if-no-files-found: warn
